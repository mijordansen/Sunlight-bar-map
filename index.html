<!DOCTYPE html>
<html>
<head>
  <title>Sunny Bars in Copenhagen</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: calc(100vh - 40px); }
    #search-container {
      padding: 10px;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .sunny { color: green; }
    .not-sunny { color: gray; }
  </style>
</head>
<body>
  <div id="search-container">
    <input id="search" type="text" placeholder="Search bars..." style="width: 100%; padding: 8px; font-size: 16px;">
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/suncalc/suncalc.js"></script>
  <script>
    const bars = [
      { name: "The Barking Dog", lat: 55.675, lon: 12.567 },
      { name: "Mikkeller Bar", lat: 55.673, lon: 12.561 },
      { name: "Bo-Bi Bar", lat: 55.679, lon: 12.577 },
      { name: "Café Sorgenfri", lat: 55.678, lon: 12.579 },
      { name: "Ølbaren", lat: 55.684, lon: 12.561 }
    ];

    const map = L.map('map').setView([55.6761, 12.5683], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: 'Map data © OpenStreetMap contributors'
    }).addTo(map);

    const now = new Date();
    let markers = [];

    function updateMarkers(filter = "") {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      bars.filter(bar => bar.name.toLowerCase().includes(filter.toLowerCase())).forEach(bar => {
        const sunPos = SunCalc.getPosition(now, bar.lat, bar.lon);
        const isSunny = sunPos.altitude > 0 && sunPos.azimuth > 0 && sunPos.azimuth < Math.PI;
        const status = isSunny ? "☀️ Sunny now" : "🌥️ Not sunny";

        const marker = L.marker([bar.lat, bar.lon]).addTo(map)
          .bindPopup(`<strong>${bar.name}</strong><br><span class="${isSunny ? 'sunny' : 'not-sunny'}">${status}</span>`);

        markers.push(marker);
      });
    }

    updateMarkers();

    document.getElementById("search").addEventListener("input", (e) => {
      updateMarkers(e.target.value);
    });
  </script>
</body>
</html>
