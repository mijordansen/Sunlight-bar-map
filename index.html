<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bars in Copenhagen</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script>
  // Initialize map
  const map = L.map('map').setView([55.6761, 12.5683], 13);  // Center on Copenhagen

  // Add OpenStreetMap tile layer
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  // Fetch and display the GeoJSON data (bars.json)
  fetch('bars.json')
    .then(response => response.json())
    .then(data => {
      // Add markers for each bar
      data.forEach(bar => {
        L.marker([bar.lat, bar.lon])
          .addTo(map)
          .bindPopup(`<b>${bar.name}</b><br>Type: ${bar.type}`)
          .openPopup();
      });
    })
    .catch(error => {
      console.error('Error loading the bars data:', error);
    });
</script>

</body>
</html>
